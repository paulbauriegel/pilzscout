[project]
name = "mushroom-packs"
version = "0.1.0"
description = "Builds the PilzScout offline packs (species DB, Wikipedia extracts, FungiTastic thumbnails, model)."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.32",
    "pillow>=10",
    "mwparserfromhell>=0.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
publish = ["huggingface_hub>=0.34"]

[project.scripts]
packs = "mushroom_packs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mushroom_packs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
